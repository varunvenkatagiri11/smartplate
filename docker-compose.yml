version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       smartplate
      POSTGRES_USER:     smartplate
      POSTGRES_PASSWORD: smartplate
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartplate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/smartplate
      SPRING_DATASOURCE_USERNAME: smartplate
      SPRING_DATASOURCE_PASSWORD: smartplate
      SPRING_REDIS_HOST:          redis
      SPRING_REDIS_PORT:          6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_RERANKER_URL: http://ml:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

  # One-shot sync job — runs on startup then exits
  # In production, replace with a cron job or Spring @Scheduled
  ml:
    build: ./ml
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://smartplate:smartplate@postgres:5432/smartplate
      MODEL_PATH: /app/model.pkl
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    environment:
      DATABASE_URL: postgresql://smartplate:smartplate@postgres:5432/smartplate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
